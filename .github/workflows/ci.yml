name: ci

on:
  # Both triggers, because a pull request is checked against its own merge commit: two
  # branches that are each green alone can still leave the base red once both have landed,
  # and without the push trigger that only surfaces in the next unrelated pull request.
  push:
    branches: [devel, main]
  pull_request:
    branches: [devel, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Three separate steps: the test step must not share the runner's CPU with
      # the app builds, and the GitHub UI shows which phase failed.
      - name: build
        run: pnpm exec turbo run build

      - name: typecheck
        run: pnpm exec turbo run typecheck

      - name: test
        run: pnpm exec turbo run test
